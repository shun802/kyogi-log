<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アルティメット スコア</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: dark turf scoreboard on top, thumb-reach score buttons right under it, record cards below. */
:root{--bg:#edf0ea;--card:#ffffff;--ink:#14231c;--sub:#5b6a61;--line:#d8ded6;--acc:#14805a;--onacc:#ffffff;--accbg:#dcf0e6;--us:#14805a;--them:#a87400;--disc:#f4c430;--warn:#b93a28;--warnbg:#fbe6e1;--sb:#0e3a2c;--sb2:#124634;--chalk:#f3f6ef;--fd:'Big Shoulders Display','Barlow Condensed','Arial Narrow',sans-serif;--fb:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1310;--card:#14201b;--ink:#e9f0ea;--sub:#93a59a;--line:#243229;--acc:#3fcf98;--onacc:#07221a;--accbg:#123327;--us:#3fcf98;--them:#f4c430;--warn:#ff8f7a;--warnbg:#3a1d17;--sb:#07251c;--sb2:#0a2e22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1310;--card:#14201b;--ink:#e9f0ea;--sub:#93a59a;--line:#243229;--acc:#3fcf98;--onacc:#07221a;--accbg:#123327;--us:#3fcf98;--them:#f4c430;--warn:#ff8f7a;--warnbg:#3a1d17;--sb:#07251c;--sb2:#0a2e22;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--fb);padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:14px 16px}
h1{font:700 22px/1.3 var(--fb);margin:6px 0 14px;text-wrap:balance}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.ttl{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:10px}
label{display:block;font-size:12px;font-weight:500;color:var(--sub);margin:12px 0 4px}
label:first-child{margin-top:0}
input,textarea,select{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:96px}
input{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;height:48px;line-height:1.2;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
.hero{padding-bottom:18px}
.hero-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:10px;margin-top:14px}
.hn{font:800 40px/1.05 var(--fd),var(--fb);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hn.o{text-align:right;color:var(--disc)}
.hv{font:700 20px/1 var(--fd);opacity:.55}
.opps{margin-top:8px}
details.rules{margin:0 0 12px;padding:0;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
details.rules>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer}
details.rules>summary::-webkit-details-marker{display:none}
details.rules>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.rules[open]>summary::after{transform:rotate(-135deg)}
details.rules .rs{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
details.rules .in{padding:0 16px 16px}
details.rules .in details{margin-top:10px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{touch-action:manipulation;cursor:pointer;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;min-height:48px;transition:transform .08s}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button.p{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
button.d{color:var(--warn)}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--sub);min-height:46px;border-radius:12px;padding:6px 4px;line-height:1.25}
.seg button.on{background:var(--acc);color:var(--onacc)}
.seg button small{display:block;font-size:11px;font-weight:400;opacity:.85}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{flex:0 0 auto;min-height:38px;padding:6px 14px;border-radius:99px}
.small{font-size:12px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);margin-left:6px}
.w{color:var(--us);font-weight:700}.l{color:var(--warn);font-weight:700}
.g{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
details{margin-top:10px;font-size:12px;color:var(--sub)}
details summary{cursor:pointer;font-weight:600}
details p{margin:6px 0 0}
/* scoreboard */
.sb{position:relative;border-radius:24px;padding:14px 16px 16px;color:var(--chalk);margin-bottom:12px;background:repeating-linear-gradient(90deg,var(--sb) 0 36px,var(--sb2) 36px 72px);box-shadow:inset 0 0 0 2px rgba(243,246,239,.16)}
.sb-head{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(243,246,239,.78)}
.sb-rule{margin-left:auto}
.pill{white-space:nowrap;background:rgba(243,246,239,.18);color:var(--chalk);border-radius:99px;padding:2px 10px;font-weight:700;font-size:12px}
.pill.key{background:var(--disc);color:#2a2100}
.sb-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-top:8px}
.sb-t{min-width:0}
.sb-t .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-t .n{font:800 92px/.9 var(--fd);font-variant-numeric:tabular-nums}
.sb-t.us .nm{color:#9ce8c8}
.sb-t.th{text-align:right}.sb-t.th .nm,.sb-t.th .n{color:var(--disc)}
.sb-vs{font:700 44px/1 var(--fd);opacity:.45;padding-bottom:8px}
.sb-clock{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:2px solid rgba(243,246,239,.24)}
.clkrow{display:flex;align-items:center;gap:8px}
.clk{font:800 46px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(243,246,239,.4);flex:none}
.sb.run .dot{background:#5af0b0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.sb.run .dot{animation:none}}
.sb-cap{font-size:12px;color:rgba(243,246,239,.72);margin-top:2px}
.clkbtn{min-width:120px;border:0;background:var(--chalk);color:#0e3a2c}
.clkbtn.start{background:var(--disc);color:#2a2100}
.sb-note{font-size:11px;color:rgba(243,246,239,.6);margin-top:10px}
.sb-warn{margin-top:10px;background:rgba(244,196,48,.18);color:#ffe28a;border-radius:12px;padding:8px 12px;font-size:13px}
.sb-warn .mini{min-height:34px;padding:2px 12px;margin-left:8px;background:transparent;color:#ffe28a;border-color:rgba(255,226,138,.5)}
.cd{font:800 26px/1 var(--fd);font-variant-numeric:tabular-nums}
/* score buttons */
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big button{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:116px;padding:14px 16px;border:0;border-radius:22px;text-align:left}
.big .u{background:var(--acc);color:var(--onacc)}
.big .o{background:var(--disc);color:#2a2100}
.big .bn{font-size:14px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big .bp{font:800 54px/1 var(--fd)}
/* counters */
.mis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--bg);border-radius:14px;padding:10px 12px}
.tile .l{font-size:13px;font-weight:600;color:var(--ink)}
.tile .ct{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.tile b{font:800 34px/1 var(--fd);font-variant-numeric:tabular-nums}
.tile button{width:40px;min-height:40px;padding:0;border-radius:12px;font-size:18px}
/* timeline */
.ev{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .tm{font:800 18px/1.4 var(--fd);color:var(--sub);min-width:46px;font-variant-numeric:tabular-nums}
.ev .tx{flex:1;font-size:14px}
/* stats */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font:800 34px/1 var(--fd);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}
.rec{display:flex;align-items:baseline;gap:14px}
.rec .n{font:800 56px/1 var(--fd)}
/* history */
.hc{border-left:6px solid var(--line)}
.hc.win{border-left-color:var(--us)}.hc.lose{border-left-color:var(--warn)}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hc-sc{display:flex;align-items:center;gap:8px;white-space:nowrap}
.hc-sc .num{font:800 34px/1 var(--fd)}
/* members */
.mem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.mem:first-of-type{border-top:0}
.mem .nb{display:inline-block;min-width:44px;text-align:center;font:800 22px/1 var(--fd);background:var(--bg);border-radius:10px;padding:7px 6px;margin-right:10px}
.mem .bt{display:flex;gap:6px}
.mem .bt button{min-height:36px;padding:2px 12px;font-size:13px}
/* nav + sheet */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:transparent;color:var(--sub);min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;position:relative}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);background:transparent}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(5,12,9,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{position:relative;background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:26px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.sheet button{width:100%;margin-top:8px}
.sheet .row button{margin-top:0}
.sheet>b{font-size:17px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var S={games:[],cur:null,tab:'game',filter:'all',sheet:false,dlg:null,view:null,period:{k:'all',from:'',to:''},roster:null,memTeam:null,sh:{w:'',n:'',mid:'',a:'',an:'',amid:'',cal:false},bl:{w:'me',n:'',mid:''},setup:{team:'WINO',event:'',target:15,half:8,mix:'1',method:'A',first:'43',cap:100,hcap:55,tmode:'cap',total:30,tostop:'0'}};
var dbDoc=null,saveT=null,syncMsg='';
function setSync(m){syncMsg=m;var e=document.getElementById('sync');if(e)e.textContent=m}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function cur(){return S.games.find(function(x){return x.id===S.cur})}
function score(g){var u=0,t=0;g.points.forEach(function(p){p.s==='us'?u++:t++});return{us:u,them:t}}
function fmt(ms){var s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function el(g){var c=g.clk;return c.ms+(c.since?Date.now()-c.since:0)}
function rl(r){return r==='43'?'男4・女3':'男3・女4'}
function ratioA(g,i){var o=g.first==='43'?'34':'43';return Math.floor((i+1)/2)%2===0?g.first:o}
function ensure(g){
  var d={mt:0,mc:0,mj:0,mk:0,mix:'0',method:'A',first:'43',ratio:'43',cap:100,hcap:55,htDone:false,ht:null,hcapHit:false,capHit:false,toTimer:null,tmode:'cap',total:30,timeUp:false,toStop:'0'};
  for(var k in d){if(g[k]===undefined)g[k]=d[k]}
  if(!g.clk)g.clk={ms:0,since:null};
  if(!g.to)g.to={us:[0,0],them:[0,0]};
  if(!g.ev)g.ev=[];
  g.points.forEach(function(p){if(p.ratio===undefined)p.ratio=null});
  if(!g.htDone&&g.done){var sc=score(g);if(Math.max(sc.us,sc.them)>=g.half)g.htDone=true}
}


function defaultRoster(){return {'WINO':[{id:'w0',no:3,name:'走川 陽来'},{id:'w1',no:4,name:'小島正程'},{id:'w2',no:5,name:'山田 幸輝'},{id:'w3',no:6,name:'眞珠 雅史'},{id:'w4',no:12,name:'辻井拓也'},{id:'w5',no:16,name:'中村一貴'},{id:'w6',no:17,name:'安山 貴己'},{id:'w7',no:18,name:'東谷亮'},{id:'w8',no:20,name:'尾崎 皓太'},{id:'w9',no:21,name:'新井群'},{id:'w10',no:23,name:'長野信之介'},{id:'w11',no:32,name:'椎木成哉'},{id:'w12',no:33,name:'谷川 颯汰'},{id:'w13',no:41,name:'角田 晴輝'},{id:'w14',no:47,name:'宇佐美 太一'},{id:'w15',no:48,name:'岩本 峻太郎',me:true},{id:'w16',no:55,name:'梅井 草矢'},{id:'w17',no:0,name:'横田健央'}],'chatons':[{id:'c0',no:1,name:'粂 祐佳'},{id:'c1',no:5,name:'山田 幸輝'},{id:'c2',no:6,name:'赤松 諒'},{id:'c3',no:7,name:'小山 純平'},{id:'c4',no:7,name:'松井 陽'},{id:'c5',no:7,name:'加藤 雄大'},{id:'c6',no:12,name:'梅井 草矢'},{id:'c7',no:17,name:'木場田 美優'},{id:'c8',no:17,name:'藤原 晋太郎'},{id:'c9',no:21,name:'吉田 充紀'},{id:'c10',no:22,name:'中尾 雄士'},{id:'c11',no:25,name:'泉 知里'},{id:'c12',no:32,name:'森口 夏鈴'},{id:'c13',no:37,name:'中西 悠太'},{id:'c14',no:39,name:'前田 愛理'},{id:'c15',no:42,name:'薗田 泰祐'},{id:'c16',no:47,name:'堀田 皓斗'},{id:'c17',no:48,name:'岩本 峻太郎',me:true},{id:'c18',no:51,name:'吉松 元輝'},{id:'c19',no:59,name:'桶河 莉葉子'},{id:'c20',no:77,name:'兵後 里奈'},{id:'c21',no:79,name:'勝野 美里'},{id:'c22',no:84,name:'継岩 可子'},{id:'c23',no:87,name:'佐藤 さくら'},{id:'c24',no:88,name:'東 拓哉'},{id:'c25',no:91,name:'川田 真心'},{id:'c26',no:96,name:'畑 佑紀'},{id:'c27',no:96,name:'羽田野 早耶'},{id:'c28',no:0,name:'小西 淳也'},{id:'c29',no:0,name:'角 彰悟'}]}}
function memLabel(m){return (m.no===''||m.no==null?'':'#'+m.no+' ')+m.name}
function sortMem(l){return l.map(function(m,i){return {m:m,i:i}}).sort(function(a,b){var x=a.m.no===''||a.m.no==null?1e9:Number(a.m.no),y=b.m.no===''||b.m.no==null?1e9:Number(b.m.no);return x-y||a.i-b.i}).map(function(o){return o.m})}
function persist(){
  S.ts=Date.now();var data={games:S.games,cur:S.cur,setup:S.setup,roster:S.roster,ts:S.ts};
  try{localStorage.setItem('ult-score',JSON.stringify(data))}catch(e){}
  clearTimeout(saveT);
  saveT=setTimeout(function(){if(dbDoc){try{
    var clean=JSON.parse(JSON.stringify(data));
    Promise.resolve(dbDoc.set(clean)).then(function(){setSync('・同期OK')},function(err){setSync('・同期エラー：'+((err&&err.message)||err))});
  }catch(e){setSync('・同期エラー：'+e.message)}}},600);
}
function apply(d){S.ts=d.ts||0;if(d.roster&&typeof d.roster==='object')S.roster=d.roster;S.games=d.games;S.cur=d.cur||null;if(d.setup){for(var k in d.setup)S.setup[k]=d.setup[k]}S.games.forEach(ensure)}
function loadLocal(){
  try{var d=JSON.parse(localStorage.getItem('ult-score')||'null');if(d&&Array.isArray(d.games))apply(d)}catch(e){}
}
async function init(){
  loadLocal();if(!S.roster)S.roster=defaultRoster();render();
  try{
    if(!window.claude||!claude.use)return;
    var db=await claude.use('db'),user=await claude.use('user');
    if(!db||!user)return;
    var id=await user.id();
    dbDoc=db.collection('data/users/'+id).doc('scorekeeper');
    var snap=await dbDoc.get();
    var d=snap&&(typeof snap.data==='function'?snap.data():snap);
    if(d&&Array.isArray(d.games)&&((d.ts||0)>(S.ts||0)||(!S.ts&&d.games.length>=S.games.length))){apply(d);render();setSync('・同期OK')}
    else if(S.ts||S.games.length){persist()}
    else setSync('・同期OK')
  }catch(e){}
}

function newGame(){
  var q=function(i){var e=document.getElementById(i);return e?e.value:''};
  var team=q('f-team').trim()||'自チーム',opp=q('f-opp').trim()||'相手';
  var tmode=q('f-tmode')||'cap',mixv=q('f-mix');
  var tv=parseInt(q('f-target'))||0,hv=parseInt(q('f-half'))||8;
  var target=tv||(tmode==='cap'?15:999),half=tmode==='cap'?hv:999;
  var cap=parseInt(q('f-cap'))||100,hcap=parseInt(q('f-hcap'))||55,total=parseInt(q('f-total'))||30;
  S.setup={team:team,event:q('f-event').trim(),target:tv||15,half:hv,mix:mixv,method:mixv==='1'?q('f-method'):S.setup.method,first:mixv==='1'?q('f-first'):S.setup.first,cap:cap,hcap:hcap,tmode:tmode,total:total};
  var first=S.setup.first;
  var g={id:uid(),date:q('f-date')||today(),team:team,opp:opp,event:S.setup.event,target:target,half:half,points:[],line:'O',played:true,blocks:0,ta:0,dr:0,note:'',done:false,
    mix:S.setup.mix,method:S.setup.method,first:first,ratio:first,cap:cap,hcap:hcap,clk:{ms:0,since:null},htDone:false,ht:null,hcapHit:false,capHit:false,to:{us:[0,0],them:[0,0]},toTimer:null,tmode:tmode,total:total,timeUp:false,ev:[]};
  g.mix=mixv;g.toStop=q('f-tostop')||'0';S.setup.tostop=g.toStop;ensure(g);
  S.games.push(g);S.cur=g.id;persist();render();
}
function addPoint(s,o){
  var g=cur();if(!g)return;o=o||{};var htFlag=false;
  var sc0=o.sc||{w:'',n:''},as0=o.as||{w:'',n:''};
  var p={id:uid(),s:s,line:g.line,played:g.played,scorer:sc0,assister:as0,cal:!!o.cal,fb:!!o.fb,goal:s==='us'&&sc0.w==='me',assist:s==='us'&&as0.w==='me',ratio:g.mix==='1'?g.ratio:null};
  if(p.goal||p.assist)p.played=true;

  else if(a==='c'&&g){var k=b.dataset.k,dd=parseInt(b.dataset.d);
    if(dd>0){g[k]=(g[k]||0)+1;logEv(g,{k:k})}
    else if(g[k]>0){g[k]--;for(var q=g.ev.length-1;q>=0;q--){if(g.ev[q].k===k){g.ev.splice(q,1);break}}}
    persist();render()}
  else if(a==='finish'){S.dlg={t:'finish'};render()}
  else if(a==='finok'&&g){var n=document.getElementById('f-note');g.note=n?n.value:'';if(g.clk.since){g.clk.ms+=Date.now()-g.clk.since;g.clk.since=null}g.toTimer=null;g.ht=null;g.done=true;S.cur=null;S.dlg=null;S.tab='hist';persist();render()}
  else if(a==='dlgclose'){S.dlg=null;render()}
  else if(a==='del'){S.dlg={t:'del',id:b.dataset.id};render()}
  else if(a==='delok'&&S.dlg){S.games=S.games.filter(function(x){return x.id!==S.dlg.id});S.dlg=null;persist();render()}
  else if(a==='filter'){S.filter=v;render()}
  else if(a==='per'){S.period.k=v;render()}
  else if(a==='copy'){
    var m=document.getElementById('cpmsg');
    try{navigator.clipboard.writeText(JSON.stringify(S.games,null,1)).then(function(){m.textContent='コピーしました'},function(){m.textContent='コピーできませんでした'})}catch(x){m.textContent='コピーできませんでした'}
  }
}
document.addEventListener('change',function(e){
  if(e.target.id==='p-from'||e.target.id==='p-to'){S.period[e.target.id==='p-from'?'from':'to']=e.target.value;render();return}
  var id=e.target.id,g=cur();if(!g||!S.roster)return;
  if(id!=='sh-sel'&&id!=='sh-asel'&&id!=='bl-sel')return;
  var m=(S.roster[g.team]||[]).find(function(x){return x.id===e.target.value});
  var w=!m?'':(m.me?'me':'o'),n=m&&!m.me?memLabel(m):'',mid=m?m.id:'';
  if(id==='sh-sel'){S.sh.w=w;S.sh.n=n;S.sh.mid=mid}
  else if(id==='sh-asel'){S.sh.a=w;S.sh.an=n;S.sh.amid=mid}
  else{S.bl.w=w;S.bl.n=n;S.bl.mid=mid}
  render();
});
init();
</script>
