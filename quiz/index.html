<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アルティメット ルールクイズ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ルールクイズ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2447c9">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: single narrow column, like a sideline card. Paper-white with a disc-blue accent and field-line rules. */
:root{
  --paper:#f6f7f4;
  --card:#ffffff;
  --ink:#16202a;
  --muted:#5c6874;
  --line:#d9ded8;
  --accent:#2447c9;
  --accent-ink:#ffffff;
  --accent-soft:#e6ebfb;
  --good:#1b7a4b;
  --good-soft:#e3f3ea;
  --bad:#b8382f;
  --bad-soft:#fbe9e7;
  --font-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10161c;--card:#18212a;--ink:#e8edf1;--muted:#9aa7b3;--line:#2b3742;
    --accent:#7f9cff;--accent-ink:#0c1226;--accent-soft:#1d2a52;
    --good:#4ccf8d;--good-soft:#14352a;--bad:#ff8a80;--bad-soft:#3b1c1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10161c;--card:#18212a;--ink:#e8edf1;--muted:#9aa7b3;--line:#2b3742;
  --accent:#7f9cff;--accent-ink:#0c1226;--accent-soft:#1d2a52;
  --good:#4ccf8d;--good-soft:#14352a;--bad:#ff8a80;--bad-soft:#3b1c1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* header */
.mast{border-top:6px solid var(--accent);padding-top:14px;margin-bottom:18px}
.mast .tag{font-size:12px;color:var(--muted);letter-spacing:.04em}
.mast h1{font-size:28px;font-weight:900;margin-top:2px}
.mast p{margin:8px 0 0;color:var(--muted);font-size:14px}

/* cards & controls */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.label{font-family:var(--font-display);font-weight:700;font-size:14px;margin-bottom:8px;display:block}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:7px 12px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chips small{color:var(--muted);margin-left:4px}
.primary{width:100%;padding:15px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:900;font-size:18px}
.ghost{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:700}
.stats{font-size:13px;color:var(--muted);text-align:center}
.note{font-size:12px;color:var(--muted);line-height:1.6}

/* quiz */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .count{font-family:var(--font-display);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.quit{border:0;background:none;color:var(--muted);font-size:13px;padding:4px}
.catpill{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:999px;margin-bottom:10px}
.qtext{font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.6}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:13px;color:var(--muted)}
.choice .t{flex:1;padding-top:1px}
.choice:not(:disabled):active{border-color:var(--accent)}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.ok .k{background:var(--good);border-color:var(--good);color:var(--paper)}
.choice.ng{border-color:var(--bad);background:var(--bad-soft)}
.choice.ng .k{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.choice:disabled{cursor:default}
.explain{margin-top:16px;border-left:4px solid var(--accent);padding:10px 14px;background:var(--card);border-radius:0 12px 12px 0}
.explain.good{border-color:var(--good)}
.explain.bad{border-color:var(--bad)}
.verdict{font-family:var(--font-display);font-weight:900;font-size:17px}
.explain.good .verdict{color:var(--good)}
.explain.bad .verdict{color:var(--bad)}
.explain p{margin:4px 0 0;font-size:14px}
.ref{font-size:12px;color:var(--muted);margin-top:6px}
.next{margin-top:14px}

/* result */
.score{text-align:center;padding:22px 16px}
.score .big{font-family:var(--font-display);font-weight:900;font-size:56px;line-height:1.1;font-variant-numeric:tabular-nums}
.score .big small{font-size:22px;color:var(--muted);font-weight:700}
.score .msg{margin-top:6px;color:var(--muted)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--good)}
.dots i.x{background:var(--bad)}
.miss{display:flex;flex-direction:column;gap:10px}
.miss details{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 14px}
.miss summary{cursor:pointer;font-weight:700;font-size:14px;line-height:1.6}
.miss .a{margin:8px 0 0;font-size:14px}
.miss .a b{color:var(--good)}
.miss .y{font-size:13px;color:var(--bad);margin-top:4px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="tag">WFDF公式ルール 2025-2028 日本語訳 ／ 付帯資料 v2.0（2026年1月1日発効）</div>
    <h1>アルティメット ルールクイズ</h1>
    <p>4択で出題します。出題する問題と選択肢の並びは、毎回ランダムに変わります。</p>
  </header>

  <!-- start -->
  <section id="start" class="stack">
    <div class="card">
      <span class="label">問題数</span>
      <div class="seg" id="nSeg">
        <button type="button" data-n="5" aria-pressed="false">5問</button>
        <button type="button" data-n="10" aria-pressed="true">10問</button>
        <button type="button" data-n="20" aria-pressed="false">20問</button>
      </div>
    </div>
    <div class="card">
      <span class="label">分野</span>
      <div class="chips" id="cats"></div>
    </div>
    <button type="button" class="primary" id="goBtn">スタート</button>
    <div class="stats" id="stats"></div>
    <p class="note">問題と解説は、世界連盟の公式英語版を基準にしています。解説の番号は、公式ルール（例：4.2）と付帯資料（例：A4.2.1）の条項です。日本語訳版（公式ルールver.1.0、付帯資料2024年版）と内容が違う点は、解説に書いています。</p>
  </section>

  <!-- quiz -->
  <section id="quiz" class="hidden">
    <div class="top">
      <span class="count" id="count"></span>
      <div class="bar"><i id="barFill"></i></div>
      <button type="button" class="quit" id="quitBtn">やめる</button>
    </div>
    <div class="card">
      <span class="catpill" id="qcat"></span>
      <div class="qtext" id="qtext"></div>
      <div class="choices" id="choices"></div>
      <div id="explain"></div>
    </div>
    <button type="button" class="primary next hidden" id="nextBtn">次の問題へ</button>
  </section>

  <!-- result -->
  <section id="result" class="hidden stack">
    <div class="card score">
      <div class="big"><span id="sc">0</span><small> / <span id="sn">0</span></small></div>
      <div class="msg" id="smsg"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div id="missWrap" class="hidden">
      <span class="label">間違えた問題</span>
      <div class="miss" id="miss"></div>
    </div>
    <button type="button" class="primary" id="againBtn">新しい問題でもう一度</button>
    <button type="button" class="ghost hidden" id="reviewBtn">間違えた問題だけ解き直す</button>
    <button type="button" class="ghost" id="homeBtn">最初の画面に戻る</button>
  </section>
</div>

<script>
/* ============ 問題バンク ============ */
const CATS = {
  spirit:"スピリット", field:"フィールド・用具", game:"試合形式・時間", pull:"プル", state:"プレイの状態",
  stall:"ストールカウント", check:"チェック", oob:"アウト・オブ・バウンズ", pos:"ポジション・接触",
  turn:"ターンオーバー", goal:"得点", call:"コールと再開", foul:"ファール", infr:"インフラクション・バイオレーション",
  safe:"安全・タイムアウト", mix:"ミックス・チーム", tour:"大会運営"
};

/* Q(分野, 問題文, 正解, [誤答...], 解説, 出典) 誤答は3つ以上入れ、出題のたびに3つを抽選します */
const S = [];
function Q(cat,q,ok,ng,ex,ref){ S.push({id:"s"+S.length,cat,q,ok,ng,ex,ref}); }

/* --- スピリット --- */
Q("spirit","コールをしてよい場面として、ルールに合っているのはどれ？",
  "ルール違反がプレイの結果を左右するほど重大な場合、または選手の安全を脅かす場合",
  ["少しでも接触や違反があったと感じたら、必ずコールする","相手チームが先にコールしたら、必ず同じ数だけコールを返す","コールするかどうかは、得点差がついているときだけ考える"],
  "コールは、プレイの結果を左右するほどの違反か、安全を脅かす場合に限って行います。","公式ルール 1.3.10");
Q("spirit","スピリット・オブ・ザ・ゲームに反する行動はどれ？",
  "相手チームからのコールへの仕返しとして、コールをすること",
  ["相手チームの良いプレイやスピリットを称賛すること","相手チームに自己紹介をすること","意見の相違や挑発行為に冷静に対応すること"],
  "仕返しのコールは禁止です。ほかの3つは、スピリットに則った行動として挙げられています。","公式ルール 1.5、1.6.5");
Q("spirit","自分のコールが正しくなかったと気付いたとき、スピリットに則った行動は？",
  "そのコールを撤回する（リトラクトをコールする）",
  ["コンテストされるまでそのまま主張する","相手チームが納得するまでコールを続ける","チームメイトに判断を任せて黙る"],
  "コールが正しいと思えなくなった時点で撤回します。撤回した場合は、その選手が反則を引き起こしたものとして再開します。","公式ルール 1.5.1、15.11");
Q("spirit","コールに関する協議で、双方の合意が得られず、直前に何が起きていたかも明らかでない場合は？",
  "最後に争いのなかったスローワー（直前の争いのないスローワー）にディスクを戻す",
  ["ディフェンス側にターンオーバーとして攻守交替する","コールをした側の主張を採用する","コイントスのようにディスクでトスをして決める"],
  "合意できない場合や事実が明白でない場合は、最後に争いのなかったスローワーに戻します。","公式ルール 1.12");
Q("spirit","コールを話し合う選手として、ルールが定めているのは？",
  "直接プレイに関わっていた選手と、そのプレイを最もよく見える位置にいた選手",
  ["キャプテンだけ","サイドラインにいるコーチと交代選手","両チームの全選手の多数決"],
  "コールは、当事者と最も良く見える位置にいた選手によって話し合われます。","公式ルール 1.10");
Q("spirit","ルールやスピリットへの故意または重大な違反があったとき、両チームのキャプテンが求められることは？",
  "話し合って適切な解決策を導く（結果がルールに沿っていなくてもよい）",
  ["必ずルールの条文どおりに処理する","その試合を自動的に没収試合にする","相手チームに1点を与える"],
  "結果がルールに沿わなくても、適切な解決策を導くことが求められます。","公式ルール 1.2.1");
Q("spirit","スピリット・ストップをコールできる人は？",
  "キャプテン、スピリットキャプテン、権限を持つ大会スタッフまたは大会競技規則委員",
  ["フィールド上の選手なら誰でも","相手チームの交代選手","観客"],
  "コールできるのは、キャプテン、スピリットキャプテン、権限を持つWFDF大会スタッフまたは大会競技規則委員です。","付帯資料v2.0 A13.1");
Q("spirit","スピリット・ストップ中の動きとして正しいのは？",
  "両チーム全員がフィールド中央にスピリット・サークルを作り、作戦会議はしない",
  ["各チームがベンチに戻って作戦会議をする","タイムアウトを1回消費する","試合時間は止めずに続ける"],
  "サークルの外でキャプテンたちが協議し、結果をサークル内で発表します。タイムアウトの回数には影響せず、試合時間は止まります。","付帯資料v2.0 A13.2〜A13.5、A4.6.1");
Q("spirit","スピリット・ストップをコールできる場面はどれ？",
  "プレイを中断するコール後からチェックで再開するまでの間、または得点後から次のプルまでの間",
  ["ディスクが空中にあるとき","スローワーがストールカウントを受けている最中","いつでもよい"],
  "コールできる場面は限られています。プレイ中にコールした場合は、直前の適切なポジションに戻って再開します。","付帯資料v2.0 A13.1、A13.6");
Q("spirit","競争心の高いプレイについて、ルールの考え方は？",
  "奨励される。ただし相手への敬意、ルールの遵守、安全、プレイを楽しむ気持ちを忘れない",
  ["勝敗に関わるので、スピリットよりも優先する","相手を威圧してでもよい","奨励されない"],
  "競争心は奨励されつつ、相手への敬意・ルール・安全・楽しむ気持ちを忘れてはいけません。","公式ルール 1.4");

/* --- フィールド・用具 --- */
Q("field","標準のプレイングフィールドの縦の長さ（エンドゾーンを含む）は？","100m",["90m","110m","120m"],
  "縦100m×横37mが標準です。セントラルゾーンは64m、エンドゾーンは各18mです。","付帯資料v2.0 A1.2.1");
Q("field","標準のプレイングフィールドの横幅は？","37m",["30m","35m","40m","45m"],"縦100m×横37mが標準です。","付帯資料v2.0 A1.2.1");
Q("field","標準のセントラルゾーンの縦の長さは？","64m",["50m","60m","70m"],"100m−（18m×2）＝64mです。","付帯資料v2.0 A1.2.2");
Q("field","標準のエンドゾーンの奥行きは？","18m",["10m","15m","20m","25m"],"エンドゾーンはセントラルゾーンの両端にそれぞれ18mです。","付帯資料v2.0 A1.2.2");
Q("field","サイドライン上は、イン・バウンズ？アウト・オブ・バウンズ？",
  "アウト・オブ・バウンズ（外周のライン上はプレイングフィールドに含まれない）",
  ["イン・バウンズ","オフェンスにとってのみイン・バウンズ","ディフェンスにとってのみアウト・オブ・バウンズ"],
  "プレイングフィールドの外周はフィールドに含まれず、オンラインはアウトです。","公式ルール 2.3");
Q("field","ゴールライン上でパスをキャッチした場合は？",
  "得点にならない（ゴールラインはセントラルゾーンに含まれる）",
  ["得点になる","ディフェンスがコールしたときだけ得点になる","ターンオーバーになる"],
  "ゴールラインはセントラルゾーンの一部で、オンラインでのプレイはゴールになりません。","公式ルール 2.4");
Q("field","ブリックマークの位置として正しいのは？",
  "ゴールラインの中心点からセントラルゾーン側に、エンドゾーンの長さに等しい距離（一般に18m）の位置",
  ["ゴールライン上の中心点","フィールドの中央","エンドゾーン奥のラインの中心点"],
  "長さ1mの2本のラインが交差した印で、セントラルゾーン内にあります。","公式ルール 2.5、付帯資料v2.0 A1.2.2");
Q("field","標準の場合、プレイングフィールドから何m以内にプレイを妨害する障害物を置いてはならない？","3m",["1m","2m","5m"],
  "フィールド外の選手や障害物にプレイを妨害されたときは、バイオレーションをコールできます。","公式ルール 2.7");
Q("field","第2制限ラインが設けられている大会で、障害物による妨害のバイオレーションをコールできる距離は、サイドラインから何m？","5m",["3m","4m","8m"],
  "第2制限ラインがある場合、2.7のバイオレーションをコールできる距離は5mになります。","付帯資料v2.0 A1.3.1");
Q("field","隣り合うフィールド同士の間隔は、最低何m必要？","3m以上",["1m以上","2m以上","6m以上"],
  "6m未満の場合は、フィールド間にいられるのは各チーム最大2名までです。","付帯資料v2.0 A1.4、A1.4.1");
Q("field","狭い会場のために特別許可を受けた場合、プレイングフィールドはどこまで縮小できる？",
  "縦90m×横35mまで（エンドゾーンとブリックマークは各15mまで）",
  ["縦80m×横30mまで","縦95m×横36mまで","縮小は認められない"],
  "縮小には、WFDF大会スタッフの書面による承認が必要です。","付帯資料v2.0 A1.5、A1.6");
Q("field","ライン（ライン引き）の幅の規定は？","75mm以上120mm以下",["25mm以上50mm以下","50mm以上75mm以下","150mm以上"],
  "線は腐食性物質ではない素材で記します。","付帯資料v2.0 A1.2.3");
Q("field","WFDFの大会で使用できるディスクは？","大会公式ディスクのみ",["両キャプテンが認めればどのディスクでもよい","ディフェンス側チームが用意したディスク","各チームが持参した任意のディスク"],
  "公式ルール3.1は両キャプテンの合意ですが、付帯資料（大会規則）では公式ディスクのみとなります。","付帯資料v2.0 A2.1.1");
Q("field","ディスクを持つチームがディスクを交換してよい場面は？",
  "得点後から次のプルまでの間",

   {t:"ストール・アウトのコールがコンテストされた",f:()=>8,ref:"公式ルール 9.5.3",why:"ストール・アウトがコンテストになった場合は「ストーリング8」から再開します。",x:false}
  ]);
  const x=rnd(1,9);
  const ans=sc2.f(x);
  const q=sc2.x?`ストールカウントが「${x}」まで完全に数えられたところで、${sc2.t}。再開するカウントは？`:`${sc2.t}。再開するストールカウントは？`;
  const okT=sc(ans);
  const ng=uniq(okT,[1,2,3,4,5,6,7,8,9,x,x+1].filter(n=>n>=1&&n<=10).map(sc),3);
  return {cat:"stall",q,ok:okT,ng,ex:sc2.why,ref:sc2.ref};
 },
 function overTimeouts(){
  const k=rnd(1,9);
  const v=k+2;
  const okT=v>=10?"ストール・アウトによるターンオーバー":sc(v);
  const base=[sc(k),sc(k+1),sc(Math.min(k+3,9)),sc(1),sc(6),sc(9),"タイムアウトが有効になりプレイ再開"];
  if(v<10) base.push("ストール・アウトによるターンオーバー");
  const ng=uniq(okT,base,3);
  return {cat:"safe",q:`プレイ有効中、取得可能回数を超えてスローワーがタイムアウトをコールした。マーカーが次に発声するはずだったカウントは「${k}」。プレイは中断し、チェックで再開する。再開時はどうなる？`,
   ok:okT,ng,ex:`次に発声するはずだったカウント（${k}）に2を加えて再開します。加えた数が10以上ならストール・アウトによるターンオーバーです。`,ref:"公式ルール 20.4"};
 },
 function timeCap(){
  const a=rnd(8,14),b=rnd(8,14);
  const v=Math.max(a,b)+1;
  const okT=v+"点";
  const ng=uniq(okT,[-3,-2,-1,1,2,3].map(d=>v+d).filter(n=>n>0).map(n=>n+"点").concat([(Math.min(a,b)+1)+"点","15点"]),3);
  return {cat:"game",q:`タイムキャップが発生した時点のポイントが終わり、スコアは${a}対${b}になった（どちらも15点に届いていない）。新しい決勝点は？`,
   ok:okT,ng,ex:`両チームの点数を比べ、高い方（${Math.max(a,b)}点）に1を加えた${v}点が新しい決勝点です。`,ref:"付帯資料v2.0 A4.2.2"};
 },
 function halfCap(){
  const a=rnd(3,7),b=rnd(3,7);
  const v=Math.max(a,b)+1;
  const okT=v+"点";
  const ng=uniq(okT,[-3,-2,-1,1,2,3].map(d=>v+d).filter(n=>n>0).map(n=>n+"点").concat([(Math.min(a,b)+1)+"点","8点"]),3);
  return {cat:"game",q:`ハーフタイムキャップが発生した時点のポイントが終わり、スコアは${a}対${b}になった（どちらも8点に届いていない）。新しいハーフタイムに入る点数は？`,
   ok:okT,ng,ex:`両チームの点数を比べ、高い方（${Math.max(a,b)}点）に1を加えた${v}点が新しいハーフタイム突入点です。`,ref:"付帯資料v2.0 A4.4.2"};
 },
 function mixRatio(){
  const first=pick(["男性4名 女性3名","男性3名 女性4名"]);
  const opp=first==="男性4名 女性3名"?"男性3名 女性4名":"男性4名 女性3名";
  const n=rnd(2,11);
  const flip=Math.floor(n/2)%2===1;
  const okT=flip?opp:first;
  const ng=uniq(okT,["男性4名 女性3名","男性3名 女性4名","男性4名 女性4名","男性3名 女性3名"],3);
  return {cat:"mix",q:`男女比決定方法A（事前決定方式）の試合で、第1ターンは${first}と決まった。第${n}ターンの男女比は？`,
   ok:okT,ng,ex:"2ターン目と3ターン目は最初と逆、4ターン目と5ターン目は最初と同じ、というように、2点入るごとに入れ替わります（ハーフタイムは影響しません）。",ref:"付帯資料v2.0 A6.2.1"};
 },
 function pivotTime(){
  const z=pick([{n:"セントラルゾーン",s:10},{n:"エンドゾーン",s:20}]);
  const okT=z.s+"秒以内";
  const ng=uniq(okT,["5秒以内","10秒以内","15秒以内","20秒以内","30秒以内"],3);
  return {cat:"state",q:`ターンオーバーの後、ディスクがアウト・オブ・バウンズではなく${z.n}にある。スローワーがピボットポイントを確定しなければならない制限時間は？`,
   ok:okT,ng,ex:"ターンオーバー後、ディスクが静止してから、セントラルゾーンなら10秒以内、エンドゾーンなら20秒以内です。違反には、ディフェンス側がプリ・ストールなどを使えます。",ref:"公式ルール 8.5.1"};
 },
 function turnoverSpot(){
  const z=pick([
   {n:"セントラルゾーン内",a:"ターンオーバーが発生した位置",ref:"公式ルール 13.9",w:"セントラルゾーン内のターンオーバーは、その位置でピボットを確定します。"},
   {n:"オフェンス側が攻めているエンドゾーン内",a:"ターンオーバーが発生した位置から最も近いゴールライン上",ref:"公式ルール 13.10",w:"攻めているエンドゾーン内では、最も近いゴールライン上で再開します。"},
   {n:"オフェンス側の自陣エンドゾーン内",a:"発生した位置、または最も近いゴールライン上のどちらかを選べる",ref:"公式ルール 13.11",w:"自陣エンドゾーン内ではスローワーが2つのうちから選べます。"}
  ]);
  const all=["ターンオーバーが発生した位置","ターンオーバーが発生した位置から最も近いゴールライン上","発生した位置、または最も近いゴールライン上のどちらかを選べる","必ずブリックマーク","必ずサイドライン上","自陣のゴールライン上"];
  return {cat:"turn",q:`${z.n}でターンオーバーが発生した。次のスローワーのピボットポイントは？（アウト・オブ・バウンズ以外）`,
   ok:z.a,ng:uniq(z.a,all,3),ex:z.w,ref:z.ref};
 }
];

/* ============ アプリ本体 ============ */
const $=id=>document.getElementById(id);
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
let mem={seen:[],total:0,correct:0};
function loadStats(){const s=LS.get("ultquiz.v1",null);if(s)mem=Object.assign(mem,s);}
function saveStats(){LS.set("ultquiz.v1",mem);}
loadStats();

let nSel=10, catSel="all";
let run=null;

function counts(){
  const c={};
  S.forEach(q=>c[q.cat]=(c[q.cat]||0)+1);
  GENS.forEach(g=>{});
  return c;
}
function renderCats(){
  const c=counts(), box=$("cats");
  const items=[["all","すべて",S.length+GENS.length]].concat(Object.keys(CATS).map(k=>[k,CATS[k],c[k]||0]));
  box.innerHTML="";
  items.forEach(([k,label,n])=>{
    const b=document.createElement("button");
    b.type="button";b.dataset.k=k;
    b.setAttribute("aria-pressed",String(k===catSel));
    b.innerHTML=label+"<small>"+n+"</small>";
    b.onclick=()=>{catSel=k;renderCats();};
    box.appendChild(b);
  });
}
function renderStats(){
  $("stats").textContent=mem.total?`これまでの通算：${mem.total}問中 ${mem.correct}問正解（${Math.round(mem.correct/mem.total*100)}%）`:"";
}
document.querySelectorAll("#nSeg button").forEach(b=>b.onclick=()=>{
  nSel=+b.dataset.n;
  document.querySelectorAll("#nSeg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
});

function buildSet(n,cat){
  const gens=GENS.map(g=>g()).filter(q=>cat==="all"||q.cat===cat);
  const nGen=cat==="all"?Math.min(gens.length,Math.max(1,Math.round(n*0.25))):Math.min(gens.length,Math.max(0,Math.round(n*0.25)));
  const pickedGen=shuffle(gens).slice(0,nGen).map((q,i)=>Object.assign({id:"g"+i+Math.random()},q));
  let pool=S.filter(q=>cat==="all"||q.cat===cat);
  const seen=new Set(mem.seen);
  let fresh=pool.filter(q=>!seen.has(q.id));
  const need=n-pickedGen.length;
  let chosen=shuffle(fresh).slice(0,need);
  if(chosen.length<need){
    const rest=shuffle(pool.filter(q=>!chosen.includes(q)));
    chosen=chosen.concat(rest.slice(0,need-chosen.length));
  }
  return shuffle(chosen.concat(pickedGen));
}
function present(q){
  const wrong=shuffle(q.ng).slice(0,3);
  const opts=shuffle([{t:q.ok,ok:true}].concat(wrong.map(t=>({t,ok:false}))));
  return Object.assign({},q,{opts});
}

function show(id){["start","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}

function startRun(list){
  run={list:list.map(present),i:0,right:0,answers:[],locked:false};
  show("quiz");renderQ();
}
$("goBtn").onclick=()=>{
  const list=buildSet(nSel,catSel);
  if(!list.length)return;
  startRun(list);
};
const LET=["A","B","C","D"];
function renderQ(){
  const q=run.list[run.i];
  $("count").textContent=(run.i+1)+" / "+run.list.length;
  $("barFill").style.width=(run.i/run.list.length*100)+"%";
  $("qcat").textContent=CATS[q.cat];
  $("qtext").textContent=q.q;
  $("explain").innerHTML="";
  $("nextBtn").classList.add("hidden");
  run.locked=false;
  const box=$("choices");box.innerHTML="";
  q.opts.forEach((o,idx)=>{
    const b=document.createElement("button");
    b.type="button";b.className="choice";b.dataset.idx=idx;
    const k=document.createElement("span");k.className="k";k.textContent=LET[idx];
    const t=document.createElement("span");t.className="t";t.textContent=o.t;
    b.appendChild(k);b.appendChild(t);
    b.onclick=()=>answer(idx);
    box.appendChild(b);
  });
}
function answer(idx){
  if(run.locked)return;
  run.locked=true;
  const q=run.list[run.i];
  const good=q.opts[idx].ok;
  if(good)run.right++;
  run.answers.push({q,idx,good});
  [...$("choices").children].forEach((b,i)=>{
    b.disabled=true;
    if(q.opts[i].ok){b.classList.add("ok");}
    else if(i===idx){b.classList.add("ng");}
  });
  mem.total++; if(good)mem.correct++;
  if(!String(q.id).startsWith("g")){ if(!mem.seen.includes(q.id))mem.seen.push(q.id); if(mem.seen.length>=S.length)mem.seen=[]; }
  saveStats();
  const ex=document.createElement("div");
  ex.className="explain "+(good?"good":"bad");
  const v=document.createElement("div");v.className="verdict";v.textContent=good?"正解":"不正解";
  const p=document.createElement("p");p.textContent=q.ex;
  const r=document.createElement("div");r.className="ref";r.textContent="出典："+q.ref;
  ex.appendChild(v);ex.appendChild(p);ex.appendChild(r);
  $("explain").appendChild(ex);
  const nb=$("nextBtn");
  nb.textContent=run.i+1>=run.list.length?"結果を見る":"次の問題へ";
  nb.classList.remove("hidden");
  nb.focus({preventScroll:true});
  nb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
$("nextBtn").onclick=()=>{
  run.i++;
  if(run.i>=run.list.length){finish();}else{renderQ();window.scrollTo(0,0);}
};
$("quitBtn").onclick=()=>{ if(run&&run.answers.length>0){finish();}else{renderStats();show("start");} };

function finish(){
  const n=run.answers.length, r=run.right;
  $("sc").textContent=r;$("sn").textContent=n;
  const pct=n?r/n:0;
  $("smsg").textContent=pct===1?"全問正解です。":pct>=0.8?"かなりルールが身についています。":pct>=0.5?"あと一歩です。間違えた問題を解き直してみましょう。":"解説を読んで、もう一度挑戦してみましょう。";
  const dots=$("dots");dots.innerHTML="";
  run.answers.forEach(a=>{const i=document.createElement("i");if(!a.good)i.className="x";dots.appendChild(i);});
  const missed=run.answers.filter(a=>!a.good);
  const mw=$("missWrap"),box=$("miss");box.innerHTML="";
  mw.classList.toggle("hidden",!missed.length);
  $("reviewBtn").classList.toggle("hidden",!missed.length);
  missed.forEach(a=>{
    const d=document.createElement("details");
    const s=document.createElement("summary");s.textContent=a.q.q;
    const ok=document.createElement("p");ok.className="a";
    const bold=document.createElement("b");bold.textContent="正解：";
    ok.appendChild(bold);ok.appendChild(document.createTextNode(a.q.ok));
    const y=document.createElement("div");y.className="y";y.textContent="あなたの答え："+a.q.opts[a.idx].t;
    const ex=document.createElement("p");ex.className="a";ex.textContent=a.q.ex;
    const rf=document.createElement("div");rf.className="ref";rf.textContent="出典："+a.q.ref;
    [s,ok,y,ex,rf].forEach(e=>d.appendChild(e));
    box.appendChild(d);
  });
  run.missed=missed.map(a=>a.q);
  show("result");
}
$("againBtn").onclick=()=>{const list=buildSet(nSel,catSel);startRun(list);};
$("reviewBtn").onclick=()=>{ if(run&&run.missed&&run.missed.length)startRun(run.missed); };
$("homeBtn").onclick=()=>{renderStats();show("start");};

document.addEventListener("keydown",e=>{
  if(!run||$("quiz").classList.contains("hidden"))return;
  const m={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  if(!run.locked&&m[e.key.toLowerCase()]!==undefined){answer(m[e.key.toLowerCase()]);}
});

renderCats();renderStats();
</script>
