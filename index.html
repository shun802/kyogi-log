<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>競技ログ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="競技ログ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14202b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-hand phone log. Summary tiles, 8-week bars, entry list, bottom sheet form. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #14202b;
  --muted: #5b6b7a;
  --line: #d5dce3;
  --accent: #e4572e;
  --accent-ink: #ffffff;
  --win: #1f8a5b;
  --loss: #c23b3b;
  --draw: #6b7a89;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161d; --surface: #172029; --ink: #e8eef3; --muted: #93a3b2; --line: #263441;
    --accent: #ff7a50; --accent-ink: #1a0d07; --win: #4cc38a; --loss: #ef6b6b; --draw: #93a3b2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161d; --surface: #172029; --ink: #e8eef3; --muted: #93a3b2; --line: #263441;
  --accent: #ff7a50; --accent-ink: #1a0d07; --win: #4cc38a; --loss: #ef6b6b; --draw: #93a3b2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 8px 0 16px; }
.sport-btn {
  background: none; border: 0; padding: 0; text-align: left;
  font-size: 26px; font-weight: 700; line-height: 1.2; text-wrap: balance;
}
.sport-btn.unset { color: var(--muted); font-weight: 500; font-size: 20px; text-decoration: underline dotted; text-underline-offset: 4px; }
.sport-input { font-size: 22px; font-weight: 700; width: 100%; padding: 6px 10px; border: 2px solid var(--accent); border-radius: 8px; background: var(--surface); }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.today { color: var(--muted); font-size: 13px; white-space: nowrap; }

.banner { background: var(--surface); border: 1px solid var(--loss); border-left-width: 5px; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 14px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.tile .label { font-size: 13px; color: var(--muted); }
.tile .big { font-size: 44px; line-height: 1.05; margin-top: 4px; }
.tile .big small { font-size: 18px; color: var(--muted); font-family: var(--font-body); font-weight: 500; margin-left: 2px; }
.tile .foot { font-size: 13px; color: var(--muted); margin-top: 4px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
.card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
.card h2 span { color: var(--muted); font-weight: 400; font-size: 12px; }
.bars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; align-items: end; height: 120px; }
.bar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; min-width: 0; }
.bar .v { font-size: 13px; color: var(--muted); height: 16px; line-height: 16px; }
.bar .col { width: 100%; background: var(--line); border-radius: 4px 4px 0 0; min-height: 2px; }
.bar.now .col { background: var(--accent); }
.bar.now .v { color: var(--ink); }
.axis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
.axis span { font-size: 11px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }

.filters { display: flex; gap: 8px; margin: 20px 0 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; text-align: left; display: grid; grid-template-columns: 52px 1fr auto; gap: 4px 12px; align-items: start; }
.row .date { grid-row: span 2; }
.row .d1 { font-size: 26px; line-height: 1; }
.row .d2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
.row .t { font-weight: 700; overflow-wrap: anywhere; }
.row .meta { font-size: 13px; color: var(--muted); }
.row .note { grid-column: 2 / 4; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; margin-right: 6px; vertical-align: 1px; }
.pill.practice { color: var(--accent); }
.pill.solo { color: var(--muted); }
.tm { font-size: 12px; font-weight: 700; background: var(--ink); color: var(--bg); border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
.pill.W { color: var(--win); } .pill.L { color: var(--loss); } .pill.D { color: var(--draw); }
.dots { display: inline-flex; gap: 3px; vertical-align: 1px; margin-left: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 28px 8px; font-size: 15px; }

.fab-wrap { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 60%, transparent); pointer-events: none; }
.fab { pointer-events: auto; display: block; margin: 0 auto; max-width: 528px; width: 100%; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; min-height: 52px; font-size: 17px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.18); }

.sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: rgba(8, 14, 20, .5); }
.panel { position: relative; background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.panel-head h2 { font-size: 18px; margin: 0; }
.ghost { background: none; border: 0; color: var(--muted); padding: 8px; min-height: 40px; }
.panel label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
.panel input[type="text"], .panel input[type="date"], .panel input[type="number"], .panel input[type="time"], .panel textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px 12px; min-height: 44px;
}
.panel textarea { resize: vertical; min-height: 72px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: var(--bg); border: 0; min-height: 44px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.score span { color: var(--muted); }
.goal-card { margin-top: 0; margin-bottom: 12px; border-left: 5px solid var(--accent); }
.goal-card .gtxt { margin: 0 0 4px; font-size: 15px; }
.pgoal { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.pgoal .ptxt { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
.pgoal .ptxt small { display: block; color: var(--muted); font-size: 12px; }
.mini { border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 10px; min-height: 40px; padding: 0 14px; font-weight: 700; white-space: nowrap; }
.goal-btn { width: 100%; margin-top: 12px; min-height: 48px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 700; }
.hint-box { margin-top: 14px; padding: 10px 12px; border-left: 4px solid var(--accent); background: var(--bg); border-radius: 6px; font-size: 14px; overflow-wrap: anywhere; }
.fb-head { margin-top: 24px; padding-top: 14px; border-top: 2px solid var(--line); font-weight: 700; font-size: 15px; }
.pill.wait { color: var(--accent); }
.pill.ok { color: var(--win); } .pill.part { color: var(--draw); } .pill.ng { color: var(--loss); }
.row .goalline { grid-column: 2 / 4; font-size: 14px; overflow-wrap: anywhere; }
.row .goalline em { font-style: normal; font-weight: 700; margin-right: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; min-height: 38px; font-size: 14px; }
.tags button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat4 span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.panel .stat4 input { padding: 10px 6px; text-align: center; }
.tagline { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.tagline span { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.tagline b { font-family: var(--font-display); font-variant-numeric: tabular-nums; margin-left: 4px; }
.row .refl { grid-column: 2 / 4; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row .refl em { font-style: normal; font-weight: 700; color: var(--ink); margin-right: 6px; }
.row .tg { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 10px; margin-top: 20px; }
.primary { flex: 1; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; min-height: 48px; font-weight: 700; }
.danger { background: none; border: 1px solid var(--loss); color: var(--loss); border-radius: 12px; min-height: 48px; padding: 0 16px; }
.foot-link { text-align: center; margin-top: 24px; }
.hint { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 20; max-width: 528px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { .fab, .chip, .row { transition: transform .08s; } .fab:active, .row:active { transform: scale(.99); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="min-width:0;flex:1">
      <div id="sportSlot"></div>
      <div class="sub">練習と試合の記録</div>
    </div>
    <div class="today num" id="todayLabel"></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="card goal-card" aria-label="今日の目標">
    <h2>今日の目標<span id="goalSub"></span></h2>
    <div id="goalBody"></div>
  </section>

  <section class="tiles" aria-label="今月のまとめ">
    <div class="tile"><div class="label">今月の練習</div><div class="big num" id="tPractice">0<small>回</small></div><div class="foot" id="tPracticeFoot"></div></div>
    <div class="tile"><div class="label">今月の試合 勝率</div><div class="big num" id="tWin">—</div><div class="foot" id="tWinFoot"></div></div>
  </section>

  <section class="card" aria-label="週ごとの練習時間">
    <h2>週ごとの練習時間<span>直近8週・時間</span></h2>
    <div class="bars" id="bars"></div>
    <div class="axis" id="axis"></div>
  </section>

  <section class="card" aria-label="今月のチーム練習内容">
    <h2>今月のチーム練習内容<span>回数</span></h2>
    <div class="tagline" id="tagStats"></div>
  </section>

  <div class="filters" role="group" aria-label="絞り込み">
    <button class="chip" data-f="all" aria-pressed="true">すべて</button>
    <button class="chip" data-f="WINO" aria-pressed="false">WINO</button>
    <button class="chip" data-f="chatons" aria-pressed="false">chatons</button>
    <button class="chip" data-f="solo" aria-pressed="false">個人練</button>
  </div>
  <ul class="list" id="list"></ul>
  <div class="foot-link"><button type="button" class="ghost" id="backupBtn">バックアップ・復元</button></div>
</div>

<div class="fab-wrap"><button class="fab" id="addBtn" type="button">＋ 目標を決める / 記録する</button></div>
<div class="toast" id="toast" hidden></div>

<div class="sheet" id="backup" hidden>
  <div class="backdrop" data-closeb></div>
  <div class="panel">
    <div class="panel-head"><h2>バックアップ・復元</h2><button type="button" class="ghost" data-closeb>閉じる</button></div>
    <p class="hint">記録はこのiPhoneのこのアプリ内にだけ保存されています。機種変更やデータ削除に備えて、ときどき下の文字列をコピーして、メモなどに貼って残してください。</p>
    <label for="bkText">バックアップ（記録のデータ）</label>
    <textarea id="bkText" rows="6"></textarea>
    <div class="actions">
      <button type="button" class="primary" id="bkCopy">コピー</button>
      <button type="button" class="danger" id="bkRestore">この内容を取り込む</button>
    </div>
    <p class="hint">「取り込む」は、同じ日の記録を上書きせず、足りない記録だけを追加・更新します。</p>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="backdrop" data-close></div>
  <form class="panel" id="form" autocomplete="off">
    <div class="panel-head"><h2 id="sheetTitle">記録を追加</h2><button type="button" class="ghost" data-close>閉じる</button></div>
    <div class="seg" id="kindSeg" role="group" aria-label="種類">
      <button type="button" data-v="practice" aria-pressed="true">チーム練</button>
      <button type="button" data-v="solo" aria-pressed="false">個人練</button>
      <button type="button" data-v="match" aria-pressed="false">試合</button>
    </div>
    <div id="teamFields">
      <label>チーム</label>
      <div class="seg" id="teamSeg" role="group" aria-label="チーム">
        <button type="button" data-v="WINO" aria-pressed="false">WINO</button>
        <button type="button" data-v="chatons" aria-pressed="false">chatons</button>
      </div>
    </div>
    <label for="fDate">日付</label>
    <input id="fDate" type="date" required>
    <div id="prevHint" class="hint-box" hidden></div>
    <label for="fGoal">今日の目標（先に決めて保存できます）</label>
    <textarea id="fGoal" maxlength="300" placeholder="今日これを意識する、できるようにする"></textarea>
    <label for="fTitle" id="titleLabel">練習内容</label>
    <input id="fTitle" type="text" maxlength="80" placeholder="例：基礎練、ダッシュ">
    <div id="practiceFields">
      <div id="tagsWrap">
        <label>やった練習（複数選べます）</label>
        <div class="tags" id="tagBox" role="group" aria-label="練習の種類"></div>
      </div>
      <label for="fStart">練習時間（何時から何時まで）</label>
      <div class="score">
        <input id="fStart" type="time" aria-label="開始時刻">
        <span>〜</span>
        <input id="fEnd" type="time" aria-label="終了時刻">
      </div>
      <div class="hint" id="durHint"></div>
    </div>
    <div id="matchFields" hidden>
      <label>結果</label>
      <div class="seg" id="resultSeg" role="group" aria-label="結果">
        <button type="button" data-v="W" aria-pressed="false">勝ち</button>
        <button type="button" data-v="L" aria-pressed="false">負け</button>
        <button type="button" data-v="D" aria-pressed="false">引き分け</button>
      </div>
      <label for="fSf">スコア（自分 − 相手）</label>
      <div class="score">
        <input id="fSf" type="number" inputmode="numeric" min="0" placeholder="自分">
        <span>−</span>
        <input id="fSa" type="number" inputmode="numeric" min="0" placeholder="相手">
      </div>
      <label for="fMinM">試合時間（分・任意）</label>
      <input id="fMinM" type="number" inputmode="numeric" min="0" max="600" step="5" placeholder="90">
      <label>自分の役割</label>
      <div class="seg" id="roleSeg" role="group" aria-label="役割">
        <button type="button" data-v="handler" aria-pressed="false">ハンドラー</button>
        <button type="button" data-v="cutter" aria-pressed="false">カッター</button>
        <button type="button" data-v="both" aria-pressed="false">両方</button>
      </div>
      <label>個人スタッツ（入れた項目だけ集計）</label>
      <div class="stat4">
        <div><span>得点</span><input id="fG" type="number" inputmode="numeric" min="0" aria-label="得点"></div>
        <div><span>アシスト</span><input id="fA" type="number" inputmode="numeric" min="0" aria-label="アシスト"></div>
        <div><span>ブロック</span><input id="fD" type="number" inputmode="numeric" min="0" aria-label="ブロック"></div>
        <div><span>ターン</span><input id="fT" type="number" inputmode="numeric" min="0" aria-label="ターンオーバー"></div>
      </div>
    </div>
    <div class="fb-head">振り返り（終わってから入力）</div>
    <label>目標の達成度</label>
    <div class="seg" id="achvSeg" role="group" aria-label="目標の達成度">
      <button type="button" data-v="ok" aria-pressed="false">達成</button>
      <button type="button" data-v="part" aria-pressed="false">一部</button>
      <button type="button" data-v="ng" aria-pressed="false">未達</button>
    </div>
    <label>調子（1 悪い 〜 5 良い）</label>
    <div class="seg" id="condSeg" role="group" aria-label="調子">
      <button type="button" data-v="1" aria-pressed="false">1</button>
      <button type="button" data-v="2" aria-pressed="false">2</button>
      <button type="button" data-v="3" aria-pressed="false">3</button>
      <button type="button" data-v="4" aria-pressed="false">4</button>
      <button type="button" data-v="5" aria-pressed="false">5</button>
    </div>
    <label for="fIssue">今日の反省・課題</label>
    <textarea id="fIssue" maxlength="600" placeholder="うまくいかなかったこと、原因"></textarea>
    <label for="fGood">良かったこと</label>
    <textarea id="fGood" maxlength="600" placeholder="できたこと、手応えがあったこと"></textarea>
    <label for="fNext">次にやること</label>
    <textarea id="fNext" maxlength="600" placeholder="次回の練習・試合で意識すること"></textarea>
    <div class="actions">
      <button type="button" class="danger" id="delBtn" hidden>削除</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function (s) { var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var WD = ['日', '月', '火', '水', '木', '金', '土'];

  var state = { entries: [], settings: { sport: '' }, filter: 'all', editing: null, editingSport: false };
  var store = null;
  var form = { kind: 'practice', team: 'WINO', achv: '', result: '', cond: '', role: '', tags: [] };
  function visible(e) { return state.filter === 'all' || (state.filter === 'solo' ? e.kind === 'solo' : e.team === state.filter); }

  document.querySelectorAll('[data-closeb]').forEach(function (el) { el.addEventListener('click', closeBackup); });
  $('#backupBtn').addEventListener('click', function () {
    $('#bkText').value = JSON.stringify({ app: 'kyogi-log', v: 1, settings: state.settings, entries: state.entries });
    $('#backup').hidden = false;
  });
  $('#bkCopy').addEventListener('click', function () {
    var t = $('#bkText'); t.focus(); t.select();
    var ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t.value); ok = true; } } catch (e) {}
    if (!ok) { try { ok = document.execCommand('copy'); } catch (e) {} }
    toast(ok ? 'コピーしました。メモなどに貼って残してください。' : '全選択しました。長押ししてコピーしてください。');
  });
  var restoreArmed = false;
  $('#bkRestore').addEventListener('click', function () {
    var b = $('#bkRestore'), data;
    try { data = JSON.parse($('#bkText').value); } catch (e) { toast('バックアップの形式が正しくありません。'); return; }
    if (!data || !Array.isArray(data.entries)) { toast('バックアップの形式が正しくありません。'); return; }
    if (!restoreArmed) { restoreArmed = true; b.textContent = 'もう一度押すと取り込む'; setTimeout(function () { restoreArmed = false; b.textContent = 'この内容を取り込む'; }, 3000); return; }
    restoreArmed = false; b.textContent = 'この内容を取り込む';
    var chain = Promise.resolve();
    data.entries.forEach(function (e) { if (e && e.id && e.date && e.kind) chain = chain.then(function () { return store.save(e); }); });
    if (data.settings && data.settings.sport) chain = chain.then(function () { return store.setSport(data.settings.sport); });
    chain.then(function () { toast(data.entries.length + '件を取り込みました。'); closeBackup(); }).catch(function () { toast('取り込めませんでした。'); });
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  /* ---------- start ---------- */
  render();
  (async function init() {
    var db = null, uid = null;
    try {
      if (typeof claude !== 'undefined' && claude && claude.use) {
        db = await claude.use('db');
        var user = await claude.use('user');
        uid = user ? await user.id() : null;
      }
    } catch (e) {}
    if (db && uid) { store = cloudStore(db, uid); }
    else { store = localStore(); render(); }
  })();
})();
</script>
</body>
</html>
